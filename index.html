<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>급식 go!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DSEG7+Classic:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-orb orb-a" aria-hidden="true"></div>
  <div class="bg-orb orb-b" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="app-header">
      <h1>급식 go!</h1>
      <p>점심시간을 읽는 가장 빠른 방법</p>
    </header>

    <section class="clock-card" aria-label="점심시간 카운트다운">
      <div class="clock-side">
        <span id="clockState">점심전</span>
        <button id="settingsBtn" class="tiny-btn" type="button" aria-label="설정 열기">⚙</button>
      </div>
      <div class="clock-main">
        <span class="digits" id="countdown">00:00</span>
        <p id="clockHelp">점심 시작까지 남은 시간</p>
      </div>
      <p class="queue-text">예상 급식 대기: <strong id="queueWait">0분</strong></p>
    </section>

    <section class="panel" aria-label="오늘 급식">
      <div class="panel-head">
        <h2>오늘의 급식</h2>
        <button id="refreshMealBtn" class="action-btn" type="button">새로고침</button>
      </div>
      <p class="panel-date" id="mealDate">날짜: -</p>
      <ul id="mealList" class="meal-list"></ul>
      <div class="meal-footer">
        <p>총 칼로리: <strong id="mealCalories">-</strong></p>
        <p>알레르기: <span id="mealAllergy">-</span></p>
      </div>
      <p id="mealStatus" class="status-text"></p>
    </section>

    <section class="panel" aria-label="부가기능 타이머">
      <div class="panel-head">
        <h2>부가기능 타이머</h2>
      </div>
      <div class="timer-box">
        <label for="timerMinutes">분 설정</label>
        <input id="timerMinutes" type="number" min="1" max="120" value="10" />
        <div class="timer-display" id="extraTimerDisplay">10:00</div>
        <div class="timer-actions">
          <button id="timerStartBtn" class="action-btn" type="button">시작</button>
          <button id="timerPauseBtn" class="action-btn ghost" type="button">일시정지</button>
          <button id="timerResetBtn" class="action-btn ghost" type="button">리셋</button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="settingsDialog" class="settings-dialog">
    <form method="dialog" id="settingsForm">
      <h3>설정</h3>
      <p class="settings-help">NEIS 정보가 없으면 샘플 급식을 표시합니다.</p>

      <label for="apiKey">NEIS API KEY</label>
      <div class="input-copy-row">
        <input id="apiKey" name="apiKey" type="text" placeholder="발급받은 키 입력" />
        <button type="button" id="copyApiKeyBtn" class="copy-btn" title="클립보드에 복사">복사</button>
      </div>

      <label for="officeCode">교육청 코드 (ATPT_OFCDC_SC_CODE)</label>
      <input id="officeCode" name="officeCode" type="text" placeholder="예: B10" />

      <label for="schoolCode">학교 코드 (SD_SCHUL_CODE)</label>
      <input id="schoolCode" name="schoolCode" type="text" placeholder="예: 7010569" />

      <div class="time-grid">
        <div>
          <label for="lunchStart">점심 시작 (HH:MM)</label>
          <input id="lunchStart" name="lunchStart" type="time" value="12:30" />
        </div>
        <div>
          <label for="lunchEnd">점심 종료 (HH:MM)</label>
          <input id="lunchEnd" name="lunchEnd" type="time" value="13:20" />
        </div>
      </div>

      <menu>
        <button value="cancel" class="action-btn ghost" type="button" id="cancelSettingsBtn">취소</button>
        <button value="default" class="action-btn" type="submit">저장</button>
      </menu>
    </form>
  </dialog>

  <script src="js/clock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
